---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: duranta-ue
  namespace: duranta

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: duranta-ue-anyuid
  namespace: duranta
subjects:
  - kind: ServiceAccount
    name: duranta-ue
    namespace: duranta
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: duranta-ue-privileged
  namespace: duranta
subjects:
  - kind: ServiceAccount
    name: duranta-ue
    namespace: duranta
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
