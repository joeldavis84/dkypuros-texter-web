apiVersion: apps/v1
kind: Deployment
metadata:
  name: texter-web
  namespace: duranta
  annotations:
    openshift.io/scc: "privileged"
spec:
  replicas: 1

  selector:
    matchLabels:
      app: duranta-ue1

  template:
    metadata:
      labels:
        app: duranta-ue1

    spec:

      serviceAccountName: duranta-ue

      ## Render the subscriber-specific nr-ue.conf before the UE starts.
      initContainers:
        - name: render-nr-ue-config
          image: quay.io/jodavis/dkypuros-texter:latest
          command: ["/app/bin/generate-config.py"]

          env:
            - name: "IMSI"
              value: "001010100000002"

              ## A valid configuration with a randomized IMSI will be built from the number in the spoke name
            - name: nodeName
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

              ## Rendered configuration on the shared volume.
            - name: outputPath
              value: "/generated/nr-ue.conf"

          volumeMounts:
            - name: generated-ue-config
              mountPath: /generated

      containers:

          ## Stock OAI UE softmodem.
          ## Keep this image unchanged so we remain version-locked.
          ## TODO: Please replace with a downstream image that takes variable information more consistently through env.
          ##       right now it's a mixture of environment variables, flat files, and command line options for a single 
          ##       source of truth
        - name: softmodem
          image: docker.io/oaisoftwarealliance/oai-nr-ue:2026.w39

          args:
          - RFSIM_IP_ADDRESS=$(getent hosts $RFSIM_HOST | awk '{print $1}'); RFSIM_IP_ADDRESS=$(if
            [[ $RFSIM_IP_ADDRESS ]]; then echo $RFSIM_IP_ADDRESS; else echo $RFSIM_HOST;fi);
            exec /opt/oai-nr-ue/bin/nr-uesoftmodem -O /opt/oai-nr-ue/etc/nr-ue.conf
            $USE_ADDITIONAL_OPTIONS --rfsimulator.serveraddr $RFSIM_IP_ADDRESS;
          command:
          - /bin/bash
          - -c
          env:
          - name: TZ
            value: America/New_York
          - name: USE_ADDITIONAL_OPTIONS
            value: -E --rfsim -r 106 --numerology 1 -C 3319680000 --log_config.global_log_options level,nocolor,time
          - name: RFSIM_HOST
            value: oai-ran
          - name: OAI_GDBSTACKS
            value: "1"

          securityContext:
            privileged: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_NICE
                - IPC_LOCK

          volumeMounts:
            - name: tun-device
              mountPath: /dev/net/tun
            - name: generated-ue-config
              mountPath: /opt/oai-nr-ue/etc/nr-ue.conf
              subPath: nr-ue.conf
              readOnly: true

          ## Flask + PJSUA2 application.
          ## This container shares the network namespace with nr-ue, so
          ## oaitun_* interfaces created by nr-uesoftmodem are visible here.
        - name: web
          image: quay.io/jodavis/dkypuros-texter:latest

          env:
              ## Interface corresponding to the IMS PDU session.
              ##
              ## If omitted or empty, check-ims.sh intentionally becomes
              ## a NOOP and always reports success.
            - name: imsInterface
              value: "oaitun_ue1p2"

              ## SIP identity is deliberately separate from the IMSI.
            - name: sipIdentity
              value: "user1"

            - name: sipDomain
              value: "dkypuros"

              ## Kamailio N6-facing address.
            - name: sipServer
              value: "192.168.27.57"

            - name: sipPort
              value: "5060"

          ports:
            - name: http
              containerPort: 8080
            - name: sip
              containerPort: 5062
              protocol: UDP

            ## Give the softmodem time to register and establish its PDU
            ## sessions before normal liveness checks begin.
            ##
            ## Successful SIP OPTIONS marks startup complete.
          startupProbe:
            exec:
              command:
                - /bin/bash
                - /app/bin/check-ims.sh
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 90

            ## This serves two purposes:
            ##
            ##   1. verifies the application's most important dependency
            ##   2. generates periodic IMS traffic, avoiding the currently
            ##      observed repeated RRC idle/resume failure in the softmodem
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - /app/bin/check-ims.sh
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 4

            ## For the initial implementation, readiness and liveness use
            ## the same definition of application health.
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - /app/bin/check-ims.sh
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 2

      volumes:
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        ## Written once by the init container and consumed by nr-ue.
        ##
        ## It survives restarts of an individual container for the
        ## lifetime of the Pod.
        - name: generated-ue-config
          emptyDir: {}
