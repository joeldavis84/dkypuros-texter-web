apiVersion: apps/v1
kind: Deployment
metadata:
  name: duranta-ue1
  namespace: duranta
spec:
  replicas: 1

  selector:
    matchLabels:
      app: duranta-ue1

  template:
    metadata:
      labels:
        app: duranta-ue1

    spec:

      serviceAccountName: duranta-ue

      ## Render the subscriber-specific nr-ue.conf before the UE starts.
      initContainers:
        - name: render-nr-ue-config
          image: registry.example.com/duranta/nr-ue-config-renderer:latest

          env:

              ## Subscriber identity.
            - name: imsi
              value: "001010000000100"

            - name: imei
              value: "356938035643803"

            - name: key
              value: "00112233445566778899aabbccddeeff"

            - name: opc
              value: "63bfa50ee6523365ff14c1f45f88737d"

              ## PLMN.
            - name: mcc
              value: "001"

            - name: mnc
              value: "01"

              ## Template renderer paths.
            - name: templatePath
              value: "/template/nr-ue.conf.tmpl"

            - name: outputPath
              value: "/generated/nr-ue.conf"

          volumeMounts:
            - name: ue-config-template
              mountPath: /template
              readOnly: true

            - name: generated-ue-config
              mountPath: /generated

      containers:

          ## Stock OAI UE softmodem.
          ## Keep this image unchanged so we remain version-locked.
        - name: nr-ue
          image: docker.io/oaisoftwarealliance/oai-nr-ue:2026.w39

          securityContext:
            privileged: true

          ## Preserve the command/args from the currently working
          ## oai-nr-ue Deployment here.
          ##
          ## Example shape only:
          #
          # command:
          #   - /opt/oai-nr-ue/bin/nr-uesoftmodem
          #
          # args:
          #   - -O
          #   - /opt/oai-nr-ue/etc/nr-ue.conf
          #   - ...

          volumeMounts:
              ## Generated by render-nr-ue-config before this container starts.
            - name: generated-ue-config
              mountPath: /opt/oai-nr-ue/etc/nr-ue.conf
              subPath: nr-ue.conf
              readOnly: true

          ## Flask + PJSUA2 application.
          ## This container shares the network namespace with nr-ue, so
          ## oaitun_* interfaces created by nr-uesoftmodem are visible here.
        - name: texter-web
          image: quay.io/jodavis/dkypuros-texter:latest

          env:
              ## Interface corresponding to the IMS PDU session.
              ##
              ## If omitted or empty, check-ims.sh intentionally becomes
              ## a NOOP and always reports success.
            - name: imsInterface
              value: "oaitun_ue1p2"

              ## SIP identity is deliberately separate from the IMSI.
            - name: sipIdentity
              value: "user1"

            - name: sipDomain
              value: "dkypuros"

              ## Kamailio N6-facing address.
            - name: sipServer
              value: "192.168.27.57"

            - name: sipPort
              value: "5060"

          ports:
            - name: http
              containerPort: 8080

            ## Give the softmodem time to register and establish its PDU
            ## sessions before normal liveness checks begin.
            ##
            ## Successful SIP OPTIONS marks startup complete.
          startupProbe:
            exec:
              command:
                - /bin/bash
                - /app/bin/check-ims.sh
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 90

            ## This serves two purposes:
            ##
            ##   1. verifies the application's most important dependency
            ##   2. generates periodic IMS traffic, avoiding the currently
            ##      observed repeated RRC idle/resume failure in the softmodem
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - /app/bin/check-ims.sh
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 4

            ## For the initial implementation, readiness and liveness use
            ## the same definition of application health.
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - /app/bin/check-ims.sh
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

      volumes:
        ## Generic nr-ue.conf template.
        ##
        ## Subscriber-specific values should not need to live here.
        - name: ue-config-template
          configMap:
            name: nr-ue-config-template

        ## Written once by the init container and consumed by nr-ue.
        ##
        ## It survives restarts of an individual container for the
        ## lifetime of the Pod.
        - name: generated-ue-config
          emptyDir: {}
